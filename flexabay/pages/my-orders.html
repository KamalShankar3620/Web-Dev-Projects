<!DOCTYPE html>
<html lang="en">

<head>
    <script>
        // Immediately set the theme from localStorage to avoid flashing
        (function () {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Submissions — FlexaBay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="my-orders.css?v=2">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,500;0,700;0,800;1,500&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- ─── NAV ─────────────────────────────────────────── -->
    <nav>
        <a href="../index.html" class="logo">Flexa<span>Bay</span></a>
        <a href="../index.html" class="nav-back">
            <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
            </svg>
            Back to home
        </a>

    </nav>

    <!-- ─── MAIN CONTENT ────────────────────────────────── -->
    <div class="page-container">
        <header class="dashboard-header">
            <h1>My Academic Submissions</h1>
            <p>Manage your active document remediations, run scans, and download polished drafts.</p>
        </header>

        <main class="dashboard-main" id="ordersList">
            <!-- Order cards will be dynamically rendered here -->
        </main>
    </div>

    <!-- ─── JAVASCRIPT ──────────────────────────────────── -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initializeOrders();
            renderOrders();
        });

        // Seed mock data if none exists
        function initializeOrders() {
            let orders = localStorage.getItem('flexabay_orders');
            if (!orders) {
                const seedData = [
                    {
                        ref: 'FB-655030',
                        services: ['Plagiarism Removal', 'AI Bypass'],
                        level: 'Postgraduate (Masters)',
                        subject: 'Business & Management',
                        words: 3000,
                        citation: ['APA 7th'],
                        deadline: '24h',
                        price: '$132.00',
                        timestamp: Date.now() - 3600000 * 2, // 2 hrs ago
                        completed: false
                    },
                    {
                        ref: 'FB-492015',
                        services: ['Referencing & Citations', 'Plagiarism Removal'],
                        level: 'Undergraduate',
                        subject: 'Social Sciences',
                        words: 1800,
                        citation: ['Harvard'],
                        deadline: '48h',
                        price: '$72.00',
                        timestamp: Date.now() - 3600000 * 120, // 5 days ago
                        completed: true
                    }
                ];
                localStorage.setItem('flexabay_orders', JSON.stringify(seedData));
            }
        }

        // Render cards
        function renderOrders() {
            const listContainer = document.getElementById('ordersList');
            const orders = JSON.parse(localStorage.getItem('flexabay_orders')) || [];

            if (orders.length === 0) {
                listContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📁</div>
                        <h3>No Submissions Found</h3>
                        <p>You haven't uploaded any documents for similarity checks yet.</p>
                        <a href="submit.html" class="btn-submit-new">Submit a Paper</a>
                    </div>
                `;
                return;
            }

            // Sort by newest first
            orders.sort((a, b) => b.timestamp - a.timestamp);

            listContainer.innerHTML = orders.map(order => createOrderCard(order)).join('');
        }

        // Helpers
        const pad = (n) => n < 10 ? '0' + n : n;
        const formatTime = (d) => `${pad(d.getHours())}:${pad(d.getMinutes())} ${d.getHours() >= 12 ? 'PM' : 'AM'}`;

        function createOrderCard(order) {
            const dateObj = new Date(order.timestamp);
            const formattedDate = dateObj.toLocaleString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });

            // Times for timeline
            const timeStep1 = formatTime(dateObj);
            const timeStep2 = formatTime(new Date(dateObj.getTime() + 60000));
            const timeStep3 = order.completed ? formatTime(new Date(dateObj.getTime() + 300000)) : 'Running';
            const timeStep4 = order.completed ? formatTime(new Date(dateObj.getTime() + 450000)) : 'Pending';
            const timeStep5 = order.completed ? formatTime(new Date(dateObj.getTime() + 600000)) : 'Pending';

            return `
                <div class="order-card" id="card-${order.ref}">
                    <!-- Card Summary Header -->
                    <div class="order-card-header" onclick="toggleDetails('${order.ref}')">
                        <div class="header-left">
                            <div class="doc-icon">📄</div>
                            <div>
                                <h3 class="order-title-text">Workspace ID: ${order.ref}</h3>
                                <span class="order-date-text">Initiated on ${formattedDate}</span>
                            </div>
                        </div>
                        <div class="header-right">
                            <div class="badge-status ${order.completed ? 'completed' : 'processing'}" id="badge-${order.ref}">
                                <span class="pulse-dot"></span>
                                <span class="badge-text" id="badge-text-${order.ref}">${order.completed ? 'Completed' : 'Processing'}</span>
                            </div>
                            <span class="arrow-icon">▼</span>
                        </div>
                    </div>

                    <!-- Metadata summary -->
                    <div class="order-summary-grid">
                        <div class="summary-item">
                            <span class="label">Remediation Tiers</span>
                            <span class="val">${order.services.join(', ')}</span>
                        </div>
                        <div class="summary-item">
                            <span class="label">Target Standard</span>
                            <span class="val">${order.level}</span>
                        </div>
                        <div class="summary-item">
                            <span class="label">Document Size</span>
                            <span class="val">${order.words.toLocaleString()} Words</span>
                        </div>
                        <div class="summary-item">
                            <span class="label">Authorized Fee</span>
                            <span class="val highlight">${order.price}</span>
                        </div>
                    </div>

                    <!-- Expandable Details -->
                    <div class="order-details-collapsed" id="details-${order.ref}">
                        <div class="details-inner">
                            <div class="pipeline-section">
                                <h4 class="section-subtitle">Linguistic Processing Pipeline</h4>

                                <div class="timeline">
                                    <!-- Step 1 -->
                                    <div class="timeline-item done">
                                        <div class="timeline-icon">✓</div>
                                        <div class="timeline-content">
                                            <div class="timeline-header">
                                                <span class="timeline-title">Upload &amp; Brief Verified</span>
                                                <span class="timeline-time">${timeStep1}</span>
                                            </div>
                                            <p class="timeline-desc">Academic files successfully decrypted in safe RAM container.</p>
                                        </div>
                                    </div>

                                    <!-- Step 2 -->
                                    <div class="timeline-item done">
                                        <div class="timeline-icon">✓</div>
                                        <div class="timeline-content">
                                            <div class="timeline-header">
                                                <span class="timeline-title">Linguist Assigned</span>
                                                <span class="timeline-time">${timeStep2}</span>
                                            </div>
                                            <p class="timeline-desc">PhD Linguist Scholar assigned to audit document semantics.</p>
                                        </div>
                                    </div>

                                    <!-- Step 3 -->
                                    <div class="timeline-item ${order.completed ? 'done' : 'active'}" id="step3-${order.ref}">
                                        <div class="timeline-icon">${order.completed ? '✓' : '3'}</div>
                                        <div class="timeline-content">
                                            <div class="timeline-header">
                                                <span class="timeline-title">Syntactic Remediation &amp; Rewrite</span>
                                                <span class="timeline-time" id="time3-${order.ref}">${timeStep3}</span>
                                            </div>
                                            <p class="timeline-desc">Re-framing similarities and humanizing AI classification markers.</p>
                                        </div>
                                    </div>

                                    <!-- Step 4 -->
                                    <div class="timeline-item ${order.completed ? 'done' : 'pending'}" id="step4-${order.ref}">
                                        <div class="timeline-icon">${order.completed ? '✓' : '4'}</div>
                                        <div class="timeline-content">
                                            <div class="timeline-header">
                                                <span class="timeline-title">Turnitin &amp; AI Detector Verification</span>
                                                <span class="timeline-time" id="time4-${order.ref}">${timeStep4}</span>
                                            </div>
                                            <p class="timeline-desc">Multi-pass plagiarism checks and neural classifier analysis.</p>
                                        </div>
                                    </div>

                                    <!-- Step 5 -->
                                    <div class="timeline-item ${order.completed ? 'done' : 'pending'}" id="step5-${order.ref}">
                                        <div class="timeline-icon">${order.completed ? '✓' : '5'}</div>
                                        <div class="timeline-content">
                                            <div class="timeline-header">
                                                <span class="timeline-title">Remediated Package Release</span>
                                                <span class="timeline-time" id="time5-${order.ref}">${timeStep5}</span>
                                            </div>
                                            <p class="timeline-desc">Final checked manuscript package made available for secure retrieval.</p>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Interactive Area (Simulation button & deliverables lock) -->
                            <div class="actions-section">
                                ${!order.completed ? `
                                    <div class="simulation-panel" id="sim-panel-${order.ref}">
                                        <div class="sim-label" id="sim-label-${order.ref}">Remediation Status: Awaiting deep scan parameters</div>
                                        <button class="btn-simulation" id="sim-btn-${order.ref}" onclick="runSimulation('${order.ref}')">
                                            ⚡ Accelerate Lab Pipeline (Demo)
                                        </button>
                                        <div class="progress-container">
                                            <div class="progress-bar-fill" id="bar-${order.ref}" style="width: 50%;"></div>
                                        </div>
                                    </div>
                                ` : ''}

                                <div class="download-panel ${order.completed ? '' : 'locked'}" id="dl-panel-${order.ref}">
                                    <h4 class="download-title" id="dl-title-${order.ref}">${order.completed ? 'Polished Deliverables Unlocked' : 'Deliverables Locked'}</h4>
                                    <p class="download-subtitle" id="dl-sub-${order.ref}">
                                        ${order.completed ? 'Final papers are decrypted and ready. Original inputs scrubbed.' : 'Files will be decrypted for secure download once the pipeline successfully completes.'}
                                    </p>

                                    <div class="download-list" id="dl-list-${order.ref}" style="display: ${order.completed ? 'flex' : 'none'};">
                                        <a href="#" class="file-item" onclick="event.preventDefault(); alert('Downloading final corrected paper...')">
                                            <span class="file-icon">📄</span>
                                            <div class="file-info">
                                                <span class="file-name">FlexaBay_Completed_Work.docx</span>
                                                <span class="file-size">42.8 KB • Decrypted Word Document</span>
                                            </div>
                                            <span class="btn-download-arrow">↓</span>
                                        </a>
                                        <a href="#" class="file-item" onclick="event.preventDefault(); alert('Downloading plagiarism report...')">
                                            <span class="file-icon">📊</span>
                                            <div class="file-info">
                                                <span class="file-name">Turnitin_Similarity_Report.pdf</span>
                                                <span class="file-size">1.2 MB • Verification Certificate</span>
                                            </div>
                                            <span class="btn-download-arrow">↓</span>
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Toggle Details Expander
        function toggleDetails(ref) {
            const details = document.getElementById(`details-${ref}`);
            const card = document.getElementById(`card-${ref}`);
            
            if (details.classList.contains('expanded')) {
                details.classList.remove('expanded');
                card.classList.remove('expanded');
            } else {
                // Collapse all others first for clean view
                document.querySelectorAll('.order-details-collapsed').forEach(el => el.classList.remove('expanded'));
                document.querySelectorAll('.order-card').forEach(el => el.classList.remove('expanded'));
                
                details.classList.add('expanded');
                card.classList.add('expanded');
            }
        }

        // Run Simulation locally for a card
        function runSimulation(ref) {
            const btn = document.getElementById(`sim-btn-${ref}`);
            const simLabel = document.getElementById(`sim-label-${ref}`);
            if (!btn || btn.disabled) return;

            btn.disabled = true;
            btn.textContent = "⏳ Turnitin comparative scan...";
            if (simLabel) simLabel.textContent = "Remediation Status: Scanning Turnitin databases...";
            
            // Move timeline step 3 to done
            const step3 = document.getElementById(`step3-${ref}`);
            step3.classList.remove('active');
            step3.classList.add('done');
            step3.querySelector('.timeline-icon').textContent = '✓';
            document.getElementById(`time3-${ref}`).textContent = formatTime(new Date());

            // Move timeline step 4 to active
            const step4 = document.getElementById(`step4-${ref}`);
            step4.classList.remove('pending');
            step4.classList.add('active');
            document.getElementById(`time4-${ref}`).textContent = 'Scanning...';
            document.getElementById(`bar-${ref}`).style.width = '75%';

            setTimeout(() => {
                btn.textContent = "⏳ GPTZero AI bypass scan...";
                if (simLabel) simLabel.textContent = "Remediation Status: Analyzing AI signatures...";
                
                // Move timeline step 4 to done
                step4.classList.remove('active');
                step4.classList.add('done');
                step4.querySelector('.timeline-icon').textContent = '✓';
                document.getElementById(`time4-${ref}`).textContent = formatTime(new Date());

                // Move timeline step 5 to active
                const step5 = document.getElementById(`step5-${ref}`);
                step5.classList.remove('pending');
                step5.classList.add('active');
                document.getElementById(`time5-${ref}`).textContent = 'Verifying...';

                setTimeout(() => {
                    // Complete simulation
                    btn.textContent = "✅ Pipeline Verified";
                    btn.style.background = "#10B981";
                    btn.style.borderColor = "#10B981";
                    btn.style.color = "#fff";
                    if (simLabel) simLabel.textContent = "Remediation Status: Completed and verified!";

                    // Move step 5 to done
                    step5.classList.remove('active');
                    step5.classList.add('done');
                    step5.querySelector('.timeline-icon').textContent = '✓';
                    document.getElementById(`time5-${ref}`).textContent = formatTime(new Date());
                    document.getElementById(`bar-${ref}`).style.width = '100%';

                    // Update Badge
                    const badge = document.getElementById(`badge-${ref}`);
                    badge.classList.remove('processing');
                    badge.classList.add('completed');
                    document.getElementById(`badge-text-${ref}`).textContent = 'Completed';

                    // Unlock downloads
                    const dlPanel = document.getElementById(`dl-panel-${ref}`);
                    dlPanel.classList.remove('locked');
                    document.getElementById(`dl-title-${ref}`).textContent = 'Polished Deliverables Unlocked';
                    document.getElementById(`dl-sub-${ref}`).textContent = 'Remediation verified: Turnitin 3.4% similarity, AI bypass 0% rating. Click files below to download:';
                    document.getElementById(`dl-list-${ref}`).style.display = 'flex';

                    // Update state in localStorage so it persists on reload
                    updateLocalStorageOrderState(ref);

                }, 1700);

            }, 1800);
        }

        // Persist completion state in localStorage
        function updateLocalStorageOrderState(ref) {
            let orders = JSON.parse(localStorage.getItem('flexabay_orders')) || [];
            orders = orders.map(order => {
                if (order.ref === ref) {
                    order.completed = true;
                }
                return order;
            });
            localStorage.setItem('flexabay_orders', JSON.stringify(orders));
        }
    </script>
    <script src="../script.js"></script>
</body>

</html>
