<!DOCTYPE html>
<html lang="en">

<head>
    <script>
        // Immediately set the theme from localStorage to avoid flashing
        (function () {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In — FlexaBay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="login.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,500;0,700;0,800;1,500&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- ─── NAV ─────────────────────────────────────────── -->
    <nav>
        <a href="../index.html" class="logo">Flexa<span>Bay</span></a>
        <a href="../index.html" class="nav-back">
            <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
            </svg>
            Back to home
        </a>

    </nav>

    <!-- ─── LOGIN CONTAINER ──────────────────────────────── -->
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <h2>Welcome Back</h2>
                <p>Sign in to manage your academic projects and tracking</p>
            </div>

            <!-- Social Logins -->
            <div class="social-login-grid">
                <button type="button" class="btn-social" onclick="simulateSocialLogin('Google')">
                    <svg class="social-icon" viewBox="0 0 24 24" width="20" height="20">
                        <path fill="#EA4335" d="M12.24 10.285V14.4h6.887c-.648 2.41-2.519 4.114-5.136 4.114-3.478 0-6.3-2.822-6.3-6.3s2.822-6.3 6.3-6.3c1.606 0 3.06.602 4.176 1.584l3.123-3.123C19.34 2.593 15.998 1.5 12.24 1.5 6.442 1.5 1.74 6.202 1.74 12s4.702 10.5 10.5 10.5c5.962 0 10.232-4.19 10.232-10.414 0-.627-.067-1.127-.188-1.8H12.24z"/>
                    </svg>
                    Google
                </button>
                <button type="button" class="btn-social" onclick="simulateSocialLogin('Apple')">
                    <svg class="social-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                        <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 4.17c.66-.81 1.11-1.93.99-3.06-1 .04-2.22.67-2.94 1.5-.63.73-1.18 1.87-1.03 2.98 1.12.09 2.26-.56 2.98-1.42z"/>
                    </svg>
                    Apple
                </button>
            </div>

            <div class="divider">
                <span>or sign in with email</span>
            </div>

            <!-- Login Form -->
            <form id="loginForm" onsubmit="handleLoginSubmit(event)">
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <svg class="field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                            <polyline points="22,6 12,13 2,6"/>
                        </svg>
                        <input type="email" id="email" placeholder="name@university.edu" required autocomplete="email" />
                    </div>
                </div>

                <div class="input-group">
                    <div class="label-row">
                        <label for="password">Password</label>
                        <a href="#" class="forgot-link" onclick="alert('Password reset simulation: A reset link has been simulated to your inbox.')">Forgot?</a>
                    </div>
                    <div class="input-wrapper">
                        <svg class="field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
                        <button type="button" class="btn-toggle-password" onclick="togglePasswordVisibility()">
                            <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="remember-row">
                    <label class="checkbox-container">
                        <input type="checkbox" id="remember" checked />
                        <span class="checkmark"></span>
                        Keep me signed in
                    </label>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    <span class="btn-text">Sign In</span>
                    <span class="btn-spinner hidden"></span>
                </button>
            </form>

            <div class="login-footer">
                <p>Don't have an account? <a href="submit.html">Get Started →</a></p>
            </div>
        </div>
    </div>

    <!-- Script to simulate login actions -->
    <script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.innerHTML = `
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                    <line x1="1" y1="1" x2="23" y2="23"/>
                `;
            } else {
                passwordInput.type = 'password';
                eyeIcon.innerHTML = `
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                `;
            }
        }

        function handleLoginSubmit(event) {
            event.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const btnText = submitBtn.querySelector('.btn-text');
            const btnSpinner = submitBtn.querySelector('.btn-spinner');
            const emailInput = document.getElementById('email');

            // Set loading state
            submitBtn.disabled = true;
            btnText.textContent = 'Verifying Account...';
            btnSpinner.classList.remove('hidden');

            setTimeout(() => {
                // Simulate success
                btnText.textContent = 'Welcome Back!';
                btnSpinner.classList.add('hidden');
                submitBtn.classList.add('success');
                
                // Save mock user state
                localStorage.setItem('flexabay_logged_in', 'true');
                localStorage.setItem('flexabay_user_email', emailInput.value || 'student@university.edu');

                setTimeout(() => {
                    // Redirect back to home with login search parameter
                    window.location.href = '../index.html?login_success=true';
                }, 1000);
            }, 1800);
        }

        function simulateSocialLogin(provider) {
            const submitBtn = document.getElementById('submitBtn');
            const btnText = submitBtn.querySelector('.btn-text');
            const btnSpinner = submitBtn.querySelector('.btn-spinner');

            submitBtn.disabled = true;
            btnText.textContent = `Connecting to ${provider}...`;
            btnSpinner.classList.remove('hidden');

            setTimeout(() => {
                btnText.textContent = 'Authenticated!';
                btnSpinner.classList.add('hidden');
                submitBtn.classList.add('success');

                localStorage.setItem('flexabay_logged_in', 'true');
                localStorage.setItem('flexabay_user_email', `${provider.toLowerCase()}_user@flexabay.com`);

                setTimeout(() => {
                    window.location.href = '../index.html?login_success=true';
                }, 1000);
            }, 1500);
        }
    </script>
    <script src="../script.js"></script>
</body>

</html>
